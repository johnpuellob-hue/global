<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - G-Global Studios</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .auth-container {
            width: 100%;
            max-width: 420px;
        }
        .auth-card {
            background: #050505;
            border: 2px solid #39FF14;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.3);
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            color: #39FF14;
            text-shadow: 0 0 15px #39FF14;
            font-size: 2rem;
            letter-spacing: 2px;
        }
        .logo p { color: #888; font-size: 0.9rem; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #111;
            color: #fff;
            font-size: 1rem;
        }
        .form-group input:focus {
            outline: none;
            border-color: #39FF14;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; accent-color: #39FF14; }
        .checkbox-group label { color: #ccc; font-size: 0.9rem; margin: 0; }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #39FF14;
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-submit:hover { background: #fff; box-shadow: 0 0 20px #fff; }
        .auth-footer {
            text-align: center;
            margin-top: 25px;
            color: #888;
            font-size: 0.9rem;
        }
        .auth-footer a { color: #39FF14; text-decoration: none; }
        .auth-footer a:hover { text-decoration: underline; }
        .flash-messages { margin-bottom: 20px; }
        .flash { padding: 12px 15px; border-radius: 8px; margin-bottom: 10px; font-size: 0.9rem; }
        .flash.success { background: #1a3a1a; border: 1px solid #39FF14; color: #39FF14; }
        .flash.error { background: #3a1a1a; border: 1px solid #ff4444; color: #ff4444; }
        .flash.info { background: #1a1a3a; border: 1px solid #4444ff; color: #4444ff; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <h1>G-GLOBAL STUDIOS</h1>
                <p>Inicia sesión para continuar</p>
            </div>
            
            <div class="flash-messages">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="flash {{ category }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
            </div>
            
            <form method="POST" action="{{ url_for('login') }}">
                <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
                
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="tu@email.com" required autocomplete="email">
                </div>
                
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" name="password" placeholder="Tu contraseña" required autocomplete="current-password">
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" name="remember" id="remember">
                    <label for="remember">Recordarme</label>
                </div>
                
                <button type="submit" class="btn-submit">INICIAR SESIÓN</button>
            </form>
            
            <div class="auth-footer">
                <p>¿No tienes cuenta? <a href="{{ url_for('register') }}">Regístrate aquí</a></p>
            </div>
        </div>
    </div>
</body>
</html>
