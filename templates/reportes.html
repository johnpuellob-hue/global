<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reportes | G-Global Studios</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 50px; }
        h1 { color: #39FF14; text-shadow: 0 0 15px #39FF14; text-transform: uppercase; }
        table { border-collapse: collapse; width: 80%; max-width: 800px; border: 2px solid #39FF14; box-shadow: 0 0 20px #39FF14; background: #050505; }
        th, td { border: 1px solid #333; padding: 15px; text-align: left; }
        th { background: #111; color: #39FF14; text-transform: uppercase; letter-spacing: 1px; }
        tr:hover { background: #1a1a1a; }
        .btn-volver { margin-top: 30px; padding: 10px 20px; border: 1px solid #39FF14; color: #39FF14; text-decoration: none; border-radius: 5px; transition: 0.3s; }
        .btn-volver:hover { background: #39FF14; color: #000; box-shadow: 0 0 20px #39FF14; }
    </style>
</head>
<body>
    <h1>📊 Panel de Ventas Realizadas</h1>
    
    <table>
        <thead>
            <tr>
                <th>Cliente</th>
                <th>Servicio</th>
                <th>Total ($)</th>
                <th>Acciones</th></tr>
        </thead>
        <tbody>
           {% for item in registros %}
    <tr>
        <td>{{ item[1] }}</td> <td>{{ item[2] }}</td> <td>${{ item[3] }}</td> <td style="text-align: center;">
            <a href="/eliminar/{{ item[0] }}" class="btn-borrar" onclick="return confirm('¿Eliminar este registro?')">🗑️</a>
        </td>
    </tr>
    {% endfor %}
        </tbody>
    </table>

    <div style="margin: 20px 0;">
    <a href="/descargar_excel" class="btn-excel">📥 Descargar Reporte Excel</a>
</div>

<style>
    /* Estilo para que el botón se vea genial y neón */
    .btn-excel {
        background-color: #000;
        color: #39FF14;
        padding: 12px 20px;
        text-decoration: none;
        border: 2px solid #39FF14;
        border-radius: 8px;
        font-weight: bold;
        box-shadow: 0 0 10px #39FF14;
        transition: 0.3s;
    }
    .btn-excel:hover {
        background-color: #39FF14;
        color: #000;
        box-shadow: 0 0 25px #39FF14;
    }
</style>
</body>
</html>
