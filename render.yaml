databases:
  - name: estudio-global-db
    databaseName: estudio_global
    user: global_user
    plan: free

services:
  - type: web
    name: g-global-studios
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: estudio-global-db
          property: connectionString
    autoDeploy: true
